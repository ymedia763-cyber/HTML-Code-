<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional HTML Tester</title>
    <style>
        /* بنیادی سیٹنگز */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        /* ہیڈر میں فل اسکرین بٹن */
        header {
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fs-btn {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* ایڈیٹر ایریا */
        .editor-container {
            flex: 1;
            margin-top: 10px;
            margin-bottom: 70px;
            display: flex;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        /* نیچے والے بٹنز */
        .footer-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .btn {
            flex: 1;
            margin: 0 8px;
            height: 48px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .run-btn {
            background-color: #ffffff;
            color: #000000;
        }

        .clear-btn {
            background-color: #222;
            color: #ffffff;
            border: 1px solid #444;
        }

        /* رزلٹ اوورلے */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #000;
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main-wrapper" id="app-container">
    <header>
        <div style="font-weight: bold; letter-spacing: 1px;">CODE TESTER</div>
        <button class="fs-btn" onclick="toggleFullScreen()">Go Fullscreen</button>
    </header>

    <div class="editor-container">
        <textarea id="code-input" placeholder="یہاں اپنا HTML کوڈ لکھیں..."></textarea>
    </div>
</div>

<div class="footer-buttons">
    <button class="btn clear-btn" onclick="clearCode()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        CLEAR
    </button>
    <button class="btn run-btn" onclick="runCode()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        RUN CODE
    </button>
</div>

<div id="result-overlay">
    <button class="close-btn" onclick="closePreview()">×</button>
    <iframe id="output-frame"></iframe>
</div>

<script>
    const textarea = document.getElementById('code-input');
    const appContainer = document.documentElement; // پوری ویب سائٹ کے لیے

    // فل اسکرین فنکشن
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            if (appContainer.requestFullscreen) {
                appContainer.requestFullscreen();
            } else if (appContainer.webkitRequestFullscreen) { /* Safari/Chrome Mobile */
                appContainer.webkitRequestFullscreen();
            } else if (appContainer.msRequestFullscreen) { /* IE11 */
                appContainer.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // رن کوڈ فنکشن
    function runCode() {
        const code = textarea.value;
        if(code.trim() === "") return;

        document.getElementById('result-overlay').style.display = 'block';
        const iframe = document.getElementById('output-frame');
        const dest = iframe.contentDocument || iframe.contentWindow.document;
        dest.open();
        dest.write(code);
        dest.close();
    }

    // کلیئر کوڈ فنکشن
    function clearCode() {
        textarea.value = "";
        textarea.focus();
    }

    // کلوز رزلٹ فنکشن
    function closePreview() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('output-frame').src = "about:blank";
    }
</script>

</body>
</html>
