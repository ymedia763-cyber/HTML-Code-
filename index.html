<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Optimized Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Consolas', monospace;
            overflow: hidden; /* باڈی کو سکرول ہونے سے روکتا ہے */
        }

        /* مین کنٹینر جو پوری اسکرین کو کنٹرول کرتا ہے */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available; /* موبائل براؤزرز کے لیے فکس */
        }

        header {
            flex: 0 0 auto;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
        }

        .fs-btn {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        /* ایڈیٹر ایریا جو باقی بچی ہوئی جگہ لے لیتا ہے */
        .editor-area {
            flex: 1 1 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            background: #000;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            color: #00d4ff;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Consolas', monospace;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* فوٹر بٹنز جو ہمیشہ نیچے نظر آئیں گے */
        .footer {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #0a0a0a;
            border-top: 1px solid #222;
            z-index: 100;
        }

        .btn {
            flex: 1;
            height: 45px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-btn {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
        }

        .run-btn {
            background: #fff;
            color: #000;
        }

        /* رزلٹ والی اسکرین */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 2000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 2001;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div style="font-size: 12px; color: #555;">@Yasiriqbal-01</div>
        <button class="fs-btn" onclick="toggleFS()">FULLSCREEN</button>
    </header>

    <div class="editor-area">
        <textarea id="code-input" spellcheck="false" placeholder="Subscribe @Yasiriqbal-01"></textarea>
    </div>

    <div class="footer">
        <button class="btn clear-btn" onclick="clearCode()">CLEAR</button>
        <button class="btn run-btn" onclick="runCode()">RUN CODE</button>
    </div>
</div>

<div id="result-overlay">
    <div class="close-btn" onclick="closePreview()">×</div>
    <iframe id="output-frame"></iframe>
</div>

<script>
    const input = document.getElementById('code-input');

    function runCode() {
        const code = input.value;
        if(code.trim() === "") return;
        
        document.getElementById('result-overlay').style.display = 'block';
        const iframe = document.getElementById('output-frame');
        const dest = iframe.contentDocument || iframe.contentWindow.document;
        dest.open();
        dest.write(code);
        dest.close();
    }

    function clearCode() {
        input.value = "";
        input.focus();
    }

    function closePreview() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('output-frame').src = "about:blank";
    }

    function toggleFS() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(e => {
                console.log("Fullscreen failed");
            });
        } else {
            document.exitFullscreen();
        }
    }

    // موبائل کی بورڈ کے لیے ونڈو ری سائز ہینڈلر
    window.visualViewport.addEventListener('resize', () => {
        document.querySelector('.app-container').style.height = window.visualViewport.height + 'px';
    });
</script>

</body>
</html>
