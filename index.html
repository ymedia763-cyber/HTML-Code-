<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Code Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            height: 100%;
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* ایڈیٹر کا ڈیزائن */
        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .fs-btn {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* رنگین کوڈ دکھانے والا ایریا */
        .editor-wrapper {
            flex: 1;
            position: relative;
            margin: 15px 0 75px 0;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        #backdrop, #code-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 15px;
            font-size: 16px;
            font-family: 'Consolas', monospace;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: none;
            outline: none;
        }

        #code-input {
            background: transparent;
            color: transparent; /* اصل ٹیکسٹ چھپا دیا تاکہ نیچے والا رنگین نظر آئے */
            caret-color: #fff; /* کرسر نظر آئے گا */
            z-index: 2;
        }

        #backdrop {
            color: #ccc;
            z-index: 1;
            pointer-events: none;
        }

        /* کلر ہائی لائٹنگ */
        .tag { color: #569cd6; font-weight: bold; } /* نیلے ٹیگز */
        .attr { color: #9cdcfe; } /* ہلکا نیلا ایٹریبیوٹ */
        .str { color: #ce9178; } /* اورنج سٹرنگز */
        .comment { color: #6a9955; } /* سبز کمنٹس */

        /* فوٹر بٹنز */
        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: #000;
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            border-top: 1px solid #333;
            z-index: 10;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .clear-btn { background: #222; color: #fff; border: 1px solid #444; }
        .run-btn { background: #fff; color: #000; }

        /* رزلٹ اوورلے - صرف کراس بٹن ہوگا */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            z-index: 1000;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn {
            position: fixed;
            top: 15px; right: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 24px;
            line-height: 40px;
            text-align: center;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <div style="font-size: 14px; color: #888;">Yasir Iqbal Editor</div>
        <button class="fs-btn" onclick="toggleFS()">Go Fullscreen</button>
    </header>

    <div class="editor-wrapper">
        <div id="backdrop"></div>
        <textarea id="code-input" spellcheck="false" placeholder="Subscribe @Yasiriqbal-01"></textarea>
    </div>
</div>

<div class="footer">
    <button class="btn clear-btn" onclick="clearCode()">CLEAR</button>
    <button class="btn run-btn" onclick="runCode()">RUN CODE</button>
</div>

<div id="result-overlay">
    <div class="close-btn" onclick="closePreview()">×</div>
    <iframe id="output-frame"></iframe>
</div>

<script>
    const input = document.getElementById('code-input');
    const backdrop = document.getElementById('backdrop');

    // کلر ہائی لائٹنگ کا فنکشن
    function updateHighlighting() {
        let text = input.value;
        
        // ایچ ٹی ایم ایل ٹیگز اور ایٹریبیوٹس کو رنگ دینا
        let highlighted = text
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/(&lt;(?!!--)[^&]+&gt;)/g, '<span class="tag">$1</span>') // ٹیگز
            .replace(/("(.*?)")/g, '<span class="str">$1</span>') // سٹرنگز
            .replace(/(&lt;!--.*?--&gt;)/g, '<span class="comment">$1</span>'); // کمنٹس

        backdrop.innerHTML = highlighted;
    }

    input.addEventListener('input', updateHighlighting);
    input.addEventListener('scroll', () => {
        backdrop.scrollTop = input.scrollTop;
        backdrop.scrollLeft = input.scrollLeft;
    });

    function runCode() {
        if(input.value.trim() === "") return;
        document.getElementById('result-overlay').style.display = 'block';
        const iframe = document.getElementById('output-frame');
        const dest = iframe.contentDocument || iframe.contentWindow.document;
        dest.open();
        dest.write(input.value);
        dest.close();
    }

    function clearCode() {
        input.value = "";
        backdrop.innerHTML = "";
        input.focus();
    }

    function closePreview() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('output-frame').src = "about:blank";
    }

    function toggleFS() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
</script>

</body>
</html>
