<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional HTML Code Tester</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        textarea:focus {
            border-color: #3498db;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s, background 0.3s;
        }

        .run-btn {
            background-color: #27ae60;
            color: white;
        }

        .run-btn:hover {
            background-color: #219150;
        }

        .clear-btn {
            background-color: #e74c3c;
            color: white;
        }

        .clear-btn:hover {
            background-color: #c0392b;
        }

        #result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1001;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            HTML Code Tester
        </div>
    </header>

    <main class="editor-section">
        <textarea id="code-input" placeholder="اپنا ایچ ٹی ایم ایل کوڈ یہاں لکھیں یا پیسٹ کریں..."></textarea>
        
        <div class="button-group">
            <button class="btn clear-btn" onclick="clearCode()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Clear
            </button>

            <button class="btn run-btn" onclick="runCode()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Run Code
            </button>
        </div>
    </main>
</div>

<div id="result-overlay">
    <button class="close-btn" onclick="closePreview()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <iframe id="output-frame"></iframe>
</div>

<script>
    const textarea = document.getElementById('code-input');

    function runCode() {
        const code = textarea.value;
        const overlay = document.getElementById('result-overlay');
        const iframe = document.getElementById('output-frame');

        if(code.trim() === "") {
            return;
        }

        overlay.style.display = 'block';
        const dest = iframe.contentDocument || iframe.contentWindow.document;
        dest.open();
        dest.write(code);
        dest.close();
    }

    function clearCode() {
        if(textarea.value !== "") {
            textarea.value = "";
            textarea.focus();
        }
    }

    function closePreview() {
        document.getElementById('result-overlay').style.display = 'none';
    }
</script>

</body>
</html>
