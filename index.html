<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed HTML Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            height: 100%;
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            background: #000;
        }

        .fs-btn {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
            padding: 6px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* ایڈیٹر فکسڈ ایریا */
        .editor-container {
            flex: 1;
            position: relative;
            background: #050505;
            overflow: hidden;
            display: flex;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #00d4ff; /* اب کوڈ کا رنگ فکس کر دیا ہے تاکہ بلنک نہ ہو */
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Consolas', monospace;
            z-index: 5;
            /* سکرولنگ کے لیے */
            overflow-y: auto;
            white-space: pre;
        }

        /* فوٹر بٹنز */
        .footer {
            height: 70px;
            background: #000;
            display: flex;
            gap: 12px;
            padding: 10px 20px;
            border-top: 1px solid #222;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .clear-btn { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .run-btn { background: #fff; color: #000; }

        /* رزلٹ اوورلے */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            z-index: 1000;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <div style="font-size: 12px; color: #555;">@Yasiriqbal-01</div>
        <button class="fs-btn" onclick="toggleFS()">GO FULLSCREEN</button>
    </header>

    <div class="editor-container">
        <textarea id="code-input" spellcheck="false" placeholder="Subscribe @Yasiriqbal-01"></textarea>
    </div>

    <div class="footer">
        <button class="btn clear-btn" onclick="clearCode()">CLEAR</button>
        <button class="btn run-btn" onclick="runCode()">RUN CODE</button>
    </div>
</div>

<div id="result-overlay">
    <div class="close-btn" onclick="closePreview()">×</div>
    <iframe id="output-frame"></iframe>
</div>

<script>
    const input = document.getElementById('code-input');

    // رن فنکشن
    function runCode() {
        if(input.value.trim() === "") return;
        
        const overlay = document.getElementById('result-overlay');
        const iframe = document.getElementById('output-frame');
        
        overlay.style.display = 'block';
        
        const dest = iframe.contentDocument || iframe.contentWindow.document;
        dest.open();
        dest.write(input.value);
        dest.close();
    }

    // کلیئر فنکشن
    function clearCode() {
        input.value = "";
        input.focus();
    }

    // کلوز فنکشن
    function closePreview() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('output-frame').src = "about:blank";
    }

    // فل اسکرین فنکشن
    function toggleFS() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert("Error: " + err.message);
            });
        } else {
            document.exitFullscreen();
        }
    }
</script>

</body>
</html>
