<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Tester</title>
    <style>
        /* بنیادی سیٹنگز */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #000000; /* کالا بیک گراؤنڈ */
            color: #ffffff;
            overflow: hidden; /* تاکہ پوری باڈی سکرول نہ ہو */
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        header {
            padding: 10px 5px;
            border-bottom: 1px solid #333;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* ایڈیٹر ایریا */
        .editor-container {
            flex: 1;
            margin-top: 10px;
            margin-bottom: 70px; /* بٹنز کے لیے جگہ چھوڑی ہے */
            display: flex;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        /* بٹن اب اسکرین کے نیچے فکس رہیں گے */
        .footer-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .btn {
            flex: 1;
            margin: 0 5px;
            height: 45px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .run-btn {
            background-color: #ffffff;
            color: #000000;
        }

        .clear-btn {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #555;
        }

        /* رزلٹ والی اسکرین */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #000;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <header>HTML CODE TESTER</header>

    <div class="editor-container">
        <textarea id="code-input" placeholder="یہاں کوڈ پیسٹ کریں..."></textarea>
    </div>
</div>

<div class="footer-buttons">
    <button class="btn clear-btn" onclick="clearCode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        CLEAR
    </button>
    <button class="btn run-btn" onclick="runCode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        RUN CODE
    </button>
</div>

<div id="result-overlay">
    <button class="close-btn" onclick="closePreview()">X</button>
    <iframe id="output-frame"></iframe>
</div>

<script>
    const textarea = document.getElementById('code-input');

    function runCode() {
        const code = textarea.value;
        if(code.trim() === "") return;

        document.getElementById('result-overlay').style.display = 'block';
        const iframe = document.getElementById('output-frame');
        const dest = iframe.contentDocument || iframe.contentWindow.document;
        dest.open();
        dest.write(code);
        dest.close();
    }

    function clearCode() {
        textarea.value = "";
        textarea.focus();
    }

    function closePreview() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('output-frame').src = "about:blank";
    }
</script>

</body>
</html>
